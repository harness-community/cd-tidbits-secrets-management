service:
  name: podinfo
  identifier: podinfo
  # REPLACE
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  # REPLACE
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  description: podinfo from a private Docker Hub repo; pull secret from Harness
  tags: {}
  serviceDefinition:
    type: Kubernetes
    spec:
      artifacts:
        primary:
          primaryArtifactRef: podinfo_image
          sources:
            - identifier: podinfo_image
              type: DockerRegistry
              spec:
                connectorRef: dockerhubconnector
                # REPLACE: private Hub repo where you already pushed a podinfo image
                imagePath: <YOUR_DOCKERHUB_USER>/podinfo
                tag: <+input>
      manifests:
        - manifest:
            identifier: podinfo_manifests
            type: K8sManifest
            spec:
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              store:
                type: Inline
                spec:
                  content: |
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: podinfo
                      labels:
                        app: podinfo
                    spec:
                      replicas: 1
                      selector:
                        matchLabels:
                          app: podinfo
                      template:
                        metadata:
                          labels:
                            app: podinfo
                        spec:
                          imagePullSecrets:
                            - name: <+artifacts.primary.imagePullSecret>
                          containers:
                            - name: podinfod
                              image: <+artifacts.primary.image>
                              imagePullPolicy: Always
                              ports:
                                - name: http
                                  containerPort: 9898
                                  protocol: TCP
                              command:
                                - ./podinfo
                                - --port=9898
                              livenessProbe:
                                httpGet:
                                  path: /healthz
                                  port: http
                                initialDelaySeconds: 5
                              readinessProbe:
                                httpGet:
                                  path: /readyz
                                  port: http
                                initialDelaySeconds: 5
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 64Mi
                                limits:
                                  cpu: "1"
                                  memory: 256Mi
                    ---
                    apiVersion: v1
                    kind: Service
                    metadata:
                      name: podinfo
                      labels:
                        app: podinfo
                    spec:
                      type: ClusterIP
                      selector:
                        app: podinfo
                      ports:
                        - name: http
                          port: 9898
                          protocol: TCP
                          targetPort: http
